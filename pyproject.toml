[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-oracle"
version = "0.1.0"
description = "Industrial Operations Intelligence and Optimization Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Industrial Oracle Team" }
]
dependencies = [
    "fastapi>=0.92.0",
    "uvicorn[standard]>=0.17.6",
    "pydantic>=1.10.4",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.5",
    "httpx>=0.23.3",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "ortools>=9.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "flake8>=6.0.0",
    "black>=23.7.0",
    "mypy>=1.4.0"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["industrial_oracle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
