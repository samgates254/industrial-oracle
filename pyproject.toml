[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial_oracle"
version = "0.1.0"
description = "Generic, product-agnostic, discrete-time constrained industrial cost and optimization engine."
authors = [
    { name = "Human Architect & Gemini Assistant" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "pyyaml>=6.0",
    "scipy>=1.10.0",
    "fastapi",
    "uvicorn",
    "jinja2",
    "SQLAlchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13,<2.0",
    "redis>=5.0,<7.0"
]

[project.scripts]
industrial-oracle = "industrial_oracle.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
