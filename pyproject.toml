[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial_oracle"
version = "0.1.0"
description = "Generic, product-agnostic, discrete-time constrained industrial cost and optimization engine."
authors = [
    { name = "Human Architect & Gemini Assistant" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=1.10.0,<2.0.0",
    "pyyaml>=6.0",
    "scipy>=1.10.0",
    "fastapi",
    "uvicorn",
    "jinja2"
]

[project.scripts]
industrial-oracle = "industrial_oracle.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
