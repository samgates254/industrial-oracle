version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: industrial_oracle_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: industrial_oracle
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: industrial_oracle_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: industrial_oracle_api
    restart: always
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/industrial_oracle
      - SYNC_DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@postgres:5432/industrial_oracle
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=industrial-oracle-super-secret-key-change-in-production-min-32-chars
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app/src
      - ../apps:/app/apps
      - ../migrations:/app/migrations
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: industrial_oracle_worker
    restart: always
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/industrial_oracle
      - SYNC_DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@postgres:5432/industrial_oracle
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=industrial-oracle-super-secret-key-change-in-production-min-32-chars
    volumes:
      - ../src:/app/src
      - ../apps:/app/apps
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
