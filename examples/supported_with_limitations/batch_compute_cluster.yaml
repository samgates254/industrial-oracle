# ==============================================================================
# INDUSTRIAL ORACLE V0.1 — REFERENCE CONFIGURATION
# ARCHETYPE: Data Center Batch Workload Scheduling
# STATUS: SUPPORTED_WITH_LIMITATIONS
#
# GOVERNING LIMITATIONS DISCLOSURE:
# This configuration models batch compute workloads as discrete countable job units
# (measured in thousands of standardized job tokens). It accurately captures job queue
# throughput, server online idle power, dynamic computing power, and time-of-use electrical
# arbitrage.
#
# KNOWN MATHEMATICAL EXCLUSIONS:
# 1. Does not model server rack thermal dynamics (ambient air dissipation, HVAC COP).
# 2. Does not model network packet contention or non-linear memory memory bandwidth.
# 3. Assumes jobs are non-preemptible within a single interval but splittable across servers.
# ==============================================================================
schema_version: "0.1.0"
contract_title: "Hyperscale Compute Cluster Workload Engine"
freeze_vector: "(A,A,A,A,B,A,A,A)"

configuration_policy:
  allow_demand_shortfall: false

time_horizon:
  num_periods: 3
  delta_t: 1.0
  tariff_partition:
    peak_periods: [2]
    offpeak_periods: [1, 3]
    shoulder_periods: []

resources:
  - resource_id: "QUEUED_TASKS"
    category: "RAW"
    initial_stock: 150.0
    safety_stock: 0.0
    max_storage: 500.0
    is_purchasable: false
  - resource_id: "PROCESSED_JOBS"
    category: "FINISHED"
    initial_stock: 0.0
    safety_stock: 0.0
    max_storage: 500.0
    is_purchasable: false

processes:
  - process_id: "INFERENCE_BATCH"
    input_coefficients:
      QUEUED_TASKS: 1.00
    output_coefficients:
      PROCESSED_JOBS: 1.00

machines:
  - machine_id: "GPU_CLUSTER_A"
    capacity_rate: 60.0
    min_load_rate: 0.0
    fixed_power: 10.0
    initial_state: 0
    compatible_processes: ["INFERENCE_BATCH"]
    variable_energy:
      INFERENCE_BATCH: 0.40
  - machine_id: "GPU_CLUSTER_B"
    capacity_rate: 40.0
    min_load_rate: 0.0
    fixed_power: 6.0
    initial_state: 0
    compatible_processes: ["INFERENCE_BATCH"]
    variable_energy:
      INFERENCE_BATCH: 0.60

economics:
  energy_tariffs:
    c_peak: 30.0
    c_offpeak: 10.0
    c_shoulder: 0.0
  demand_charge_rate: 500.0
  fixed_charge: 2000.0
  purchase_costs: {}
  setup_costs:
    GPU_CLUSTER_A: 200.0
    GPU_CLUSTER_B: 150.0
  holding_costs:
    QUEUED_TASKS: 2.0
    PROCESSED_JOBS: 0.0
  penalty_costs: {}

electrical_parameters:
  power_factor: 0.95
  contract_limit_kva: 100.0

demand:
  - resource_id: "PROCESSED_JOBS"
    period: 3
    quantity: 100.0
