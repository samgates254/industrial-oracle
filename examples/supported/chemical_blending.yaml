# ==============================================================================
# INDUSTRIAL ORACLE V0.1 — REFERENCE CONFIGURATION
# ARCHETYPE: Continuous Chemical Blending (Multi-Input Stoichiometry)
# STATUS: SUPPORTED_BY_V0.1
# ==============================================================================
schema_version: "0.1.0"
contract_title: "Specialty Chemical Formulation Plant"
freeze_vector: "(A,A,A,A,B,A,A,A)"

configuration_policy:
  allow_demand_shortfall: false

time_horizon:
  num_periods: 3
  delta_t: 1.0
  tariff_partition:
    peak_periods: [2]
    offpeak_periods: [1, 3]
    shoulder_periods: []

resources:
  - resource_id: "ACID_REAGENT"
    category: "RAW"
    initial_stock: 200.0
    safety_stock: 10.0
    max_storage: 500.0
    is_purchasable: true
  - resource_id: "BASE_BUFFER"
    category: "RAW"
    initial_stock: 100.0
    safety_stock: 5.0
    max_storage: 300.0
    is_purchasable: true
  - resource_id: "BUFFERED_SOLUTION"
    category: "FINISHED"
    initial_stock: 0.0
    safety_stock: 0.0
    max_storage: 400.0
    is_purchasable: false

processes:
  - process_id: "EXOTHERMIC_BLEND"
    input_coefficients:
      ACID_REAGENT: 0.60
      BASE_BUFFER: 0.40
    output_coefficients:
      BUFFERED_SOLUTION: 0.98

machines:
  - machine_id: "CONTINUOUS_REACTOR"
    capacity_rate: 80.0
    min_load_rate: 15.0
    fixed_power: 4.0
    initial_state: 0
    compatible_processes: ["EXOTHERMIC_BLEND"]
    variable_energy:
      EXOTHERMIC_BLEND: 0.25

economics:
  energy_tariffs:
    c_peak: 22.0
    c_offpeak: 11.0
    c_shoulder: 0.0
  demand_charge_rate: 350.0
  fixed_charge: 800.0
  purchase_costs:
    ACID_REAGENT: 40.0
    BASE_BUFFER: 30.0
  setup_costs:
    CONTINUOUS_REACTOR: 250.0
  holding_costs:
    ACID_REAGENT: 0.8
    BASE_BUFFER: 0.5
    BUFFERED_SOLUTION: 1.2
  penalty_costs: {}

electrical_parameters:
  power_factor: 0.90
  contract_limit_kva: 120.0

demand:
  - resource_id: "BUFFERED_SOLUTION"
    period: 3
    quantity: 120.0
